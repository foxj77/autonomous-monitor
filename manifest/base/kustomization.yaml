apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This is a kustomize base. To deploy, copy or symlink this directory into
# your cluster's GitOps repo and add overlays per target namespace. The
# simplest way to monitor N namespaces is to deploy N copies of this base
# with different `namespace:` patches in an overlay.

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - networkpolicy.yaml
  - deployment.yaml

commonLabels:
  app.kubernetes.io/name: autonomous-monitor
  app.kubernetes.io/managed-by: kustomize
