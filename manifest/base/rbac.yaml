apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autonomous-monitor
  namespace: default
rules:
  # Core resources, namespaced
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - configmaps
      - services
      - persistentvolumeclaims
    verbs: [get, list, watch]
  # Workloads
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: [get, list, watch]
  # State ConfigMap writes. Reads are included in the core configmaps rule above.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, update, patch]
  # To monitor custom resources, add namespaced get/list/watch rules for the
  # specific API groups and resources you want in an overlay.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autonomous-monitor
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: autonomous-monitor
subjects:
  - kind: ServiceAccount
    name: autonomous-monitor
    namespace: default
