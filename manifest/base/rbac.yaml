apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: autonomous-monitor
rules:
  # Core resources, namespaced
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - configmaps
      - services
      - persistentvolumeclaims
    verbs: [get, list, watch]
  # Workloads
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: [get, list, watch]
  # Custom resources. Granting list on a CRD group is the cleanest approach.
  # Restrict the resource list per your actual installed CRDs in production
  # overlays.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: [get, list, watch]
---
# Per-namespace Role: only needed for state ConfigMap writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autonomous-monitor
  namespace: default
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autonomous-monitor
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: autonomous-monitor
subjects:
  - kind: ServiceAccount
    name: autonomous-monitor
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autonomous-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: autonomous-monitor
subjects:
  - kind: ServiceAccount
    name: autonomous-monitor
    namespace: default
