apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: autonomous-monitor-discovery
rules:
  - nonResourceURLs:
      - /api
      - /api/*
      - /apis
      - /apis/*
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autonomous-monitor-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: autonomous-monitor-discovery
subjects:
  - kind: ServiceAccount
    name: autonomous-monitor
    namespace: default
