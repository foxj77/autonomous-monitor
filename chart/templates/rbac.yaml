apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "autonomous-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autonomous-monitor.labels" . | nindent 4 }}
rules:
  # Core resources, namespaced. The monitor only ever reads the watch
  # namespace, never anything else.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - configmaps
      - services
      - persistentvolumeclaims
    verbs: [get, list, watch]
  # Workloads
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: [get, list, watch]
  # State ConfigMap writes. Reads are included in the core configmaps
  # rule above.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, update, patch]
  # Metrics-server scrape (used when resourceUsage.backend ==
  # "metrics-server"). The metrics.k8s.io API is namespaced in metrics
  # server v0.x and we want namespaced access only.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: [get, list]
  {{- with .Values.customResources.rbacRules }}
  # Custom resource rules, supplied via values.customResources.rbacRules.
  # Each entry is a full RBAC PolicyRule. This is where you grant access
  # to the specific custom resources the monitor should scan.
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "autonomous-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autonomous-monitor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "autonomous-monitor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "autonomous-monitor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
