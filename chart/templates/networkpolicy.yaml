apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "autonomous-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autonomous-monitor.labels" . | nindent 4 }}
spec:
  # Default-deny ingress on the monitor's pods. Anything not explicitly
  # allowed below is dropped. The :8080 metrics port is the only ingress
  # by default, and (when values.networkPolicy.ingress.metrics.from is
  # set) only from the configured podSelector.
  podSelector:
    matchLabels:
      {{- include "autonomous-monitor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.networkPolicy.ingress.metrics.from }}
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
      from:
        {{- toYaml .Values.networkPolicy.ingress.metrics.from | nindent 8 }}
  {{- else }}
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  {{- end }}
  {{- if .Values.networkPolicy.egress.overrides }}
  egress:
    {{- toYaml .Values.networkPolicy.egress.overrides | nindent 4 }}
  {{- else }}
  egress:
    # DNS resolution (kube-dns / CoreDNS).
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API server. The API server endpoint is reachable on 443
    # in-cluster; many managed clusters also expose it on 6443. Allow
    # both to be safe.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # Kafka-compatible broker. Plaintext defaults to 9092; TLS and SASL
    # deployments commonly use 9093. Allow both so a single base works
    # for either.
    - ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
  {{- end }}
