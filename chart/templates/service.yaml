apiVersion: v1
kind: Service
metadata:
  name: {{ include "autonomous-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autonomous-monitor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "autonomous-monitor.selectorLabels" . | nindent 4 }}
