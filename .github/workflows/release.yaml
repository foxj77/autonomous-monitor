name: release

# Triggered when release-please publishes a GitHub Release. If that release is
# created with the default GitHub token and the release event is suppressed, the
# workflow_run trigger below detects the SemVer tag that release-please created
# and publishes the same artifacts. Manual dispatch can publish a supplied
# SemVer version, or an edge/sha-only build when version is blank.
on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer to publish (e.g. 0.2.0). Leave blank for an edge/sha-only build."
        required: false
        default: ""

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_REGISTRY: oci://ghcr.io/foxj77/charts
  GO_VERSION: "1.26"

jobs:
  resolve-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.meta.outputs.is_stable }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      binary_tag: ${{ steps.meta.outputs.binary_tag }}
      ref_name: ${{ steps.meta.outputs.ref_name }}
      major: ${{ steps.meta.outputs.major }}
      major_minor: ${{ steps.meta.outputs.major_minor }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.ref_name }}"
            version="${tag#v}"
            is_stable="true"
            should_publish="true"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.conclusion }}" != "success" || "${{ github.event.workflow_run.head_branch }}" != "main" ]]; then
              echo "Release Please did not complete successfully on main; skipping publish."
              should_publish="false"
              tag=""
              version=""
              is_stable="false"
            else
              workflow_sha="${{ github.event.workflow_run.head_sha }}"
              tag=$(git tag --points-at "$workflow_sha" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
              if [[ -z "$tag" ]]; then
                echo "No SemVer tag points at ${workflow_sha}; skipping publish."
                should_publish="false"
                version=""
                is_stable="false"
              else
                version="${tag#v}"
                is_stable="true"
                should_publish="true"
              fi
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            version="${version#v}"
            tag="v${version}"
            is_stable="true"
            should_publish="true"
          else
            short_sha=$(echo "${{ github.sha }}" | cut -c1-7)
            tag="edge-${short_sha}"
            version=""
            is_stable="false"
            should_publish="true"
          fi

          if [[ "$is_stable" == "true" && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable releases must use SemVer tags like v0.2.0; got ${tag}" >&2
            exit 1
          fi

          major=""
          major_minor=""
          image_tag="$tag"
          if [[ "$is_stable" == "true" ]]; then
            IFS=. read -r major minor patch <<< "$version"
            major_minor="${major}.${minor}"
            image_tag="$version"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "binary_tag=${tag}-binary" >> "$GITHUB_OUTPUT"
          echo "is_stable=${is_stable}" >> "$GITHUB_OUTPUT"
          echo "ref_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "major=${major}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${major_minor}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: resolve-metadata
    if: needs.resolve-metadata.outputs.should_publish == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build binaries (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: autonomous-monitor:extract-amd64
          outputs: type=local,dest=dist/amd64
      - name: Build binaries (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/arm64
          tags: autonomous-monitor:extract-arm64
          outputs: type=local,dest=dist/arm64
      - name: Rename binaries
        run: |
          mv dist/amd64/autonomous-monitor dist/amd64/autonomous-monitor-linux-amd64 || true
          mv dist/arm64/autonomous-monitor dist/arm64/autonomous-monitor-linux-arm64 || true
          ls -la dist/amd64 dist/arm64
      - name: Generate SBOM (linux/amd64)
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-linux-amd64.spdx.json
          format: spdx-json
          output-file: dist/sbom-linux-amd64.spdx.json
      - name: Generate SBOM (linux/arm64)
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-linux-arm64.spdx.json
          format: spdx-json
          output-file: dist/sbom-linux-arm64.spdx.json
      - name: Checksums
        run: |
          cd dist
          sha256sum amd64/autonomous-monitor-linux-amd64 arm64/autonomous-monitor-linux-arm64 > SHA256SUMS
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: |
            dist/amd64/autonomous-monitor-linux-amd64
            dist/arm64/autonomous-monitor-linux-arm64
            dist/sbom-linux-amd64.spdx.json
            dist/sbom-linux-arm64.spdx.json
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: resolve-metadata
    if: needs.resolve-metadata.outputs.should_publish == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=${{ needs.resolve-metadata.outputs.version }},enable=${{ needs.resolve-metadata.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.resolve-metadata.outputs.major_minor }},enable=${{ needs.resolve-metadata.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.resolve-metadata.outputs.major }},enable=${{ needs.resolve-metadata.outputs.is_stable == 'true' && !startsWith(needs.resolve-metadata.outputs.tag, 'v0.') }}
            type=raw,value=latest,enable=${{ needs.resolve-metadata.outputs.is_stable == 'true' }}
            type=raw,value=edge,enable=${{ needs.resolve-metadata.outputs.is_stable != 'true' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=autonomous-monitor
            org.opencontainers.image.description=Deterministic Kubernetes namespace monitor that publishes JSON findings
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
          provenance: true
          sbom: true
      - name: Make package public
        if: needs.resolve-metadata.outputs.is_stable == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
        run: |
          ENCODED="${PACKAGE_NAME//\//%2F}"
          if [[ "$OWNER_TYPE" == "Organization" ]]; then
            gh api --method PATCH "/orgs/${OWNER}/packages/container/${ENCODED}/visibility" -f visibility=public
          else
            gh api --method PATCH "/user/packages/container/${ENCODED}/visibility" -f visibility=public
          fi

  cosign-sign:
    name: cosign sign
    runs-on: ubuntu-latest
    needs: [resolve-metadata, container]
    if: needs.resolve-metadata.outputs.should_publish == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.resolve-metadata.outputs.image_tag }}
        run: |
          # For multi-arch images, the manifest list is what cosign signs.
          # The index digest is exposed in the Docker-Content-Digest header
          # by buildx imagetools inspect.
          digest=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" 2>/dev/null | awk -F': ' '/^Digest:/ {print $2}' | head -1 | tr -d ' ')
          if [[ -z "$digest" ]]; then
            echo "Failed to extract digest; falling back to tag-based sign"
            cosign sign --yes "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          else
            cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${digest}"
          fi

  publish-oci-artifact:
    name: OCI artifact (binary)
    runs-on: ubuntu-latest
    needs: [resolve-metadata, binaries]
    if: needs.resolve-metadata.outputs.should_publish == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: dist
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install oras
        env:
          ORAS_VERSION: "1.3.2"
        run: |
          curl -sSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin oras
          oras version
      - name: Push OCI artifact
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          BINARY_TAG: ${{ needs.resolve-metadata.outputs.binary_tag }}
        run: |
          oras push \
            --artifact-type application/vnd.autonomous-monitor.binary.v1 \
            "${REGISTRY}/${IMAGE_NAME}:${BINARY_TAG}" \
            ./dist/amd64/autonomous-monitor-linux-amd64:application/octet-stream \
            ./dist/arm64/autonomous-monitor-linux-arm64:application/octet-stream \
            ./dist/SHA256SUMS:text/plain
      - name: Attach README
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          BINARY_TAG: ${{ needs.resolve-metadata.outputs.binary_tag }}
        run: |
          oras attach \
            --artifact-type application/vnd.autonomous-monitor.docs.v1 \
            "${REGISTRY}/${IMAGE_NAME}:${BINARY_TAG}" \
            ./README.md:application/text

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [resolve-metadata, binaries, container, cosign-sign, publish-oci-artifact, helm-publish]
    if: needs.resolve-metadata.outputs.should_publish == 'true'
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: dist
      - name: Generate notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-metadata.outputs.tag }}
          VERSION: ${{ needs.resolve-metadata.outputs.version }}
          BINARY_TAG: ${{ needs.resolve-metadata.outputs.binary_tag }}
        run: |
          if [[ "${{ needs.resolve-metadata.outputs.is_stable }}" == "true" ]]; then
            notes=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)
            if [[ -z "$notes" ]]; then
              cat > notes.md <<EOF
          ## autonomous-monitor ${TAG}

          Pull the image:

          \`\`\`
          docker pull ghcr.io/${{ github.repository }}:${VERSION}
          \`\`\`

          Install the Helm chart:

          \`\`\`
          helm install autonomous-monitor oci://ghcr.io/foxj77/charts/autonomous-monitor --version ${VERSION}
          \`\`\`

          Pull the raw binaries as an OCI artifact (requires \`oras\`):

          \`\`\`
          oras pull ghcr.io/${{ github.repository }}:${BINARY_TAG}
          \`\`\`

          Verify with cosign:

          \`\`\`
          cosign verify ghcr.io/${{ github.repository }}:${VERSION} --certificate-identity-regexp '.*' --certificate-oidc-issuer '.*'
          \`\`\`
          EOF
              notes=$(cat notes.md)
            fi
          else
            notes="Pre-built artifacts for commit \`${TAG}\`. For stable releases see the \`v*.*.*\` tags."
          fi
          echo "NOTES<<EOF" >> "$GITHUB_ENV"
          echo "$notes" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-metadata.outputs.tag }}
          name: ${{ needs.resolve-metadata.outputs.tag }}
          body: ${{ env.NOTES }}
          draft: false
          prerelease: ${{ needs.resolve-metadata.outputs.is_stable != 'true' }}
          generate_release_notes: true
          files: |
            dist/amd64/autonomous-monitor-linux-amd64
            dist/arm64/autonomous-monitor-linux-arm64
            dist/sbom-linux-amd64.spdx.json
            dist/sbom-linux-arm64.spdx.json
            dist/SHA256SUMS

  helm-publish:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    needs: [resolve-metadata]
    # Runs on real SemVer releases and on manual dispatches where a version is supplied.
    if: needs.resolve-metadata.outputs.should_publish == 'true' && needs.resolve-metadata.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Extract version
        id: version
        run: |
          echo "version=${{ needs.resolve-metadata.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into Chart.yaml
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" chart/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" chart/Chart.yaml

      - name: Lint chart
        run: helm lint chart/

      - name: Template chart (default values)
        # Sanity check: the chart must render without errors at the most
        # common install shape, and the env vars that are required for
        # the monitor to start (WATCH_NAMESPACE, REDPANDA_BROKER,
        # FINDINGS_TOPIC) must be present in the rendered Deployment.
        run: |
          helm template autonomous-monitor chart/ --namespace default > /tmp/render.yaml
          for var in WATCH_NAMESPACE REDPANDA_BROKER FINDINGS_TOPIC \
                     DOWNSTREAM_TRIAGE_ENABLED DOWNSTREAM_MIN_SCORE \
                     STATE_CONFIGMAP_NAME CHECK_PODS_ENABLED; do
            grep -q "name: $var" /tmp/render.yaml || { echo "missing $var in render"; exit 1; }
          done
          echo "default-values render asserts passed"

      - name: Template chart (custom values + custom-resource RBAC)
        # Verifies the values-customisation paths the README advertises:
        # name override, image tag pin, custom CRB RBAC rules, and a
        # restricted metrics-ingress NetworkPolicy selector.
        run: |
          helm template my-release chart/ --namespace flux-system \
            --set nameOverride=autonomous-monitor \
            --set image.tag=${{ steps.version.outputs.version }} \
            --set customResources.rbacRules[0].apiGroups="{source.toolkit.fluxcd.io,helm.toolkit.fluxcd.io}" \
            --set customResources.rbacRules[0].resources="{\*}" \
            --set customResources.rbacRules[0].verbs="{get,list,watch}" \
            --set networkPolicy.ingress.metrics.from.podSelector.matchLabels.app=prometheus \
            > /tmp/custom.yaml
          grep -q "source.toolkit.fluxcd.io" /tmp/custom.yaml || { echo "missing CRB rule"; exit 1; }
          grep -q "app: prometheus" /tmp/custom.yaml || { echo "missing NP selector"; exit 1; }
          grep -q "ghcr.io/foxj77/autonomous-monitor:${{ steps.version.outputs.version }}" /tmp/custom.yaml || { echo "missing image tag"; exit 1; }
          echo "custom-values render asserts passed"

      - name: Template chart (schema rejects invalid values)
        # Sanity check the values.schema.json. Each --set should fail
        # the schema check and produce a non-zero exit.
        run: |
          for bad in \
            "image.pullPolicy=Sometimes" \
            "service.type=EvilService" \
            "resourceUsage.backend=prometheus" \
            "thresholds.memoryCriticalPercent=200"; do
            if helm template test chart/ --set "$bad" > /dev/null 2>&1; then
              echo "schema failed to reject $bad"; exit 1
            fi
          done
          echo "schema rejects all four invalid inputs"

      - name: Package chart
        run: helm package chart/

      - name: Log in to GHCR OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR OCI registry
        run: |
          helm push \
            autonomous-monitor-${{ steps.version.outputs.version }}.tgz \
            ${{ env.CHART_REGISTRY }}
