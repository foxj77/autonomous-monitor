name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: "1.23"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install librdkafka headers
        run: sudo apt-get update && sudo apt-get install -y librdkafka-dev pkg-config
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install librdkafka headers
        run: sudo apt-get update && sudo apt-get install -y librdkafka-dev pkg-config
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.target == 'linux-amd64' && 'linux' || 'linux' }}
          GOARCH: ${{ matrix.target == 'linux-amd64' && 'amd64' || 'arm64' }}
        run: |
          mkdir -p dist
          out="dist/autonomous-monitor-${{ matrix.target }}"
          go build -tags musl -trimpath -ldflags "-s -w" -o "$out" .
          chmod +x "$out"
          "$out" --help 2>&1 | head -5 || true
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/autonomous-monitor-${{ matrix.target }}
          retention-days: 14
          if-no-files-found: error
