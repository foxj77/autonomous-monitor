name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install librdkafka headers
        run: sudo apt-get update && sudo apt-get install -y librdkafka-dev pkg-config
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # Native host-arch build smoke test. Multi-arch (linux/amd64 + linux/arm64)
  # container images and binaries are produced by the release workflow using
  # Docker buildx + QEMU, which handles the CGO cross-compile correctly. A
  # raw go-cross-compile on an amd64 runner cannot build the arm64 C runtime
  # for confluent-kafka-go, so we do not attempt it here.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install librdkafka headers
        run: sudo apt-get update && sudo apt-get install -y librdkafka-dev pkg-config
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -tags musl -trimpath -ldflags "-s -w" -o "dist/autonomous-monitor" .
          chmod +x "dist/autonomous-monitor"
          "dist/autonomous-monitor" 2>&1 | head -3 || true
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: binary
          path: dist/autonomous-monitor
          retention-days: 7
          if-no-files-found: error
